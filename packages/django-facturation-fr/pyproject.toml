[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-facturation-fr"
version = "0.3.0"
description = "Facturation pour Django : factures et avoirs numérotés, mentions légales françaises, PDF et Factur-X (EN 16931)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["Django>=5.2,<6", "reportlab>=4.2", "factur-x>=3.1", "Pillow>=10.1", "lxml>=5.0", "pypdf>=4.0"]
classifiers = [
    "Framework :: Django", "Framework :: Django :: 5.2", "Natural Language :: French",
    "Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Source = "https://github.com/MatRai-hexa/django-compta-facturation-fr"
Issues = "https://github.com/MatRai-hexa/django-compta-facturation-fr/issues"

[tool.setuptools.packages.find]
include = ["facturation_fr*"]

[tool.setuptools.package-data]
facturation_fr = ["templates/invoicing/*.html", "xsd/ereporting/*.xsd", "xsd/ereporting/*.md"]
