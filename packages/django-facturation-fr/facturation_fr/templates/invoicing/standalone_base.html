{# Gabarit par défaut quand le projet n'en fournit pas (réglage INVOICING["BASE_TEMPLATE"]). #}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Facturation{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6f8; }
    .glass-card { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 18px; }
    .btn-outline-light { color: #1f2328; border-color: #d0d5dd; background: #fff; }
  </style>
</head>
<body>
  <main class="container py-4">
    {% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
