name: Publication sur PyPI

# Publication par « Trusted Publishing » : PyPI fait confiance à ce workflow, un environnement par paquet
# (« pypi-django-accounting-fr », « pypi-django-facturation-fr ») : un jeton PyPI ne vaut que pour un projet.
# Aucun mot de passe ni jeton n'est stocké. Déclenchée par la création d'une release GitHub.
on:
  release:
    types: [published]

jobs:
  build:
    name: Construction et contrôle des paquets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Version des paquets = étiquette de la release
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/pyproject.toml; do
            grep -q "^version = \"$tag\"$" "$p" || { echo "::error::$p n'est pas en version $tag"; exit 1; }
          done
      - run: |
          for p in django-accounting-fr django-facturation-fr; do python -m build packages/$p --outdir dist/$p; done
      - run: twine check --strict dist/*/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Envoi sur PyPI (${{ matrix.package }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [django-accounting-fr, django-facturation-fr]
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
